<!DOCTYPE html>
<html>
<head>
    <title>To-Do-List</title>
    <link rel='stylesheet' href='style.css'>
</head>
<body>
    <div id="main">

        <div id="projects-list-div">
            <button type="button" id="new-project-btn">New Project</button>
            <ul id="projects-list"></ul>
        </div>

        <div id="project-expanded">
            <div id="project">
                <h1 id="project-name"></h1>
                <h2 id="add-task-btn">Add task</h2>

                <div id="add-task-form">
                    <label for="title">Title:</label>
                    <input type="text" id="title" class="add-task-input"><br><br>

                    <label for="description">Description:</label>
                    <input type="text" id="description" class="add-task-input"><br><br>

                    <label for="due">Due:</label>
                    <input type="date" id="due" class="add-task-input"><br><br>

                    <label for="priority">Priority:</label><br>
                    <select id="priority">
                        <option value="high">High</option>
                        <option value="medium">Medium</option>
                        <option value="low">Low</option>
                    </select><br>

                    <br><br><button type="button" id="submit-btn">Submit</button>
                </div>

                <div id="project-tasks"></div>
            </div>

            <p id="delete-btn">Delete</p>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
